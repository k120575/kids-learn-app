<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小企鵝動作</title>
<style>
:root{--bg:#fbf8f3;--fg:#2b2b2b;--muted:#6b6b6b;--card:#fff;--line:#e8e2d8}
@media (prefers-color-scheme:dark){:root{--bg:#1d1c1a;--fg:#eee;--muted:#aaa;--card:#2a2926;--line:#3a3833}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans TC",sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
h1{margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
figure img{width:100%;height:auto;border-radius:10px;background:#fff}
figcaption{margin-top:8px;color:var(--muted)}
</style></head><body><main>
<h1>小企鵝動作（造型 A）</h1>
<div class="grid"><figure><img src="../../assets/images/mascot/wave.webp" alt="揮手（打招呼）"><figcaption>揮手（打招呼）</figcaption></figure><figure><img src="../../assets/images/mascot/cheer.webp" alt="歡呼（答對）"><figcaption>歡呼（答對）</figcaption></figure><figure><img src="../../assets/images/mascot/think.webp" alt="思考（出題）"><figcaption>思考（出題）</figcaption></figure><figure><img src="../../assets/images/mascot/encourage.webp" alt="加油（答錯）"><figcaption>加油（答錯）</figcaption></figure><figure><img src="../../assets/images/mascot/sleep.webp" alt="睡覺（休息提醒）"><figcaption>睡覺（休息提醒）</figcaption></figure></div>
</main></body></html>
