<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>美術風格提案</title>
<style>
:root{--bg:#fbf8f3;--fg:#2b2b2b;--muted:#6b6b6b;--card:#fff;--line:#e8e2d8}
@media (prefers-color-scheme:dark){:root{--bg:#1d1c1a;--fg:#eee;--muted:#aaa;--card:#2a2926;--line:#3a3833}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans TC",sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
h1{margin:0 0 4px} .sub{color:var(--muted);margin:0 0 32px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:28px}
h2{margin:0} .note{color:var(--muted);margin:4px 0 16px}
.home{position:relative;border-radius:12px;overflow:hidden;margin-bottom:16px}
.home img{display:block;width:100%;height:auto}
.home .m{position:absolute;left:4%;bottom:4%;width:22%;height:auto;mix-blend-mode:multiply}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
figure{margin:0;text-align:center} figure img{width:100%;height:auto;border-radius:12px;background:#fff}
figcaption{font-size:14px;color:var(--muted);margin-top:6px}
</style></head><body><main>
<h1>寶貝學習樂園｜美術風格提案</h1>
<p class="sub">同一組題材用三種畫風繪製（gemini-2.5-flash-image）。吉祥物小熊只是佔位，角色設定另外決定。</p>
<section><h2>黏土 3D</h2><p class="note">軟Q立體、像捏出來的玩具；小朋友接受度最高，但和童樂簿同路線</p><div class="home"><img src="clay/home_bg.webp" alt="首頁背景"><img class="m" src="clay/mascot.webp" alt=""></div><div class="grid"><figure><img src="clay/mascot.webp" alt="吉祥物（佔位：小熊）"><figcaption>吉祥物（佔位：小熊）</figcaption></figure><figure><img src="clay/icon_language.webp" alt="語文"><figcaption>語文</figcaption></figure><figure><img src="clay/icon_math.webp" alt="邏輯數學"><figcaption>邏輯數學</figcaption></figure><figure><img src="clay/icon_spatial.webp" alt="空間"><figcaption>空間</figcaption></figure><figure><img src="clay/icon_music.webp" alt="音樂"><figcaption>音樂</figcaption></figure><figure><img src="clay/item_apple.webp" alt="題目物件（取代 🍎）"><figcaption>題目物件（取代 🍎）</figcaption></figure></div></section><section><h2>繪本水彩</h2><p class="note">溫暖手繪、像床邊故事書；有教育感、市面上少見，容易做出區隔</p><div class="home"><img src="watercolor/home_bg.webp" alt="首頁背景"><img class="m" src="watercolor/mascot.webp" alt=""></div><div class="grid"><figure><img src="watercolor/mascot.webp" alt="吉祥物（佔位：小熊）"><figcaption>吉祥物（佔位：小熊）</figcaption></figure><figure><img src="watercolor/icon_language.webp" alt="語文"><figcaption>語文</figcaption></figure><figure><img src="watercolor/icon_math.webp" alt="邏輯數學"><figcaption>邏輯數學</figcaption></figure><figure><img src="watercolor/icon_spatial.webp" alt="空間"><figcaption>空間</figcaption></figure><figure><img src="watercolor/icon_music.webp" alt="音樂"><figcaption>音樂</figcaption></figure><figure><img src="watercolor/item_apple.webp" alt="題目物件（取代 🍎）"><figcaption>題目物件（取代 🍎）</figcaption></figure></div></section><section><h2>扁平貼紙</h2><p class="note">乾淨向量、粗白邊貼紙；最好維持一致、縮小也清楚，最接近現有 App 的感覺</p><div class="home"><img src="sticker/home_bg.webp" alt="首頁背景"><img class="m" src="sticker/mascot.webp" alt=""></div><div class="grid"><figure><img src="sticker/mascot.webp" alt="吉祥物（佔位：小熊）"><figcaption>吉祥物（佔位：小熊）</figcaption></figure><figure><img src="sticker/icon_language.webp" alt="語文"><figcaption>語文</figcaption></figure><figure><img src="sticker/icon_math.webp" alt="邏輯數學"><figcaption>邏輯數學</figcaption></figure><figure><img src="sticker/icon_spatial.webp" alt="空間"><figcaption>空間</figcaption></figure><figure><img src="sticker/icon_music.webp" alt="音樂"><figcaption>音樂</figcaption></figure><figure><img src="sticker/item_apple.webp" alt="題目物件（取代 🍎）"><figcaption>題目物件（取代 🍎）</figcaption></figure></div></section>
